      default:
        cue: "Ontem,"
        hint: "com o meu pai ao telefone"

  preterito_imperfeito_indicativo:
    context:
      default:
        cue: "Antigamente,"
        hint: "sempre em português"

  futuro_indicativo:
    context:
      default:
        cue: "Amanhã,"
        hint: "sobre o projeto"

  condicional:
    context:
      default:
        cue: "Se fosse possível,"
        hint: "mais devagar"

  presente_conjuntivo:
    context:
      default:
        cue: "Espero que"
        hint: "com mais calma"

  preterito_imperfeito_conjuntivo:
    context:
      default:
        cue: "Se"
        hint: "a verdade"

  futuro_conjuntivo:
    context:
      default:
        cue: "Quando"
        hint: "com o chefe"

