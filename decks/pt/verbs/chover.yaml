    forms:
      1sg: null
      2sg: null
      3sg: chove
      1pl: null
      2pl: null

    context:
      default:
        cue: "No inverno,"
        hint: "muito no Norte"
      3pl:
        cue: "As queixas? Todos os dias,"
        hint: "de todos os lados"
    notes:
      3pl: "[[Note]]: Only figurative in the plural: things \"rain down\" (`chovem críticas`, `chovem pedidos`)."

  preterito_perfeito_indicativo:
