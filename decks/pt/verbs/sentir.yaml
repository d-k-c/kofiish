tenses:
  presente_indicativo:
    forms:
      1sg: sinto

    context:
      default:
        cue: "Agora"
        hint: "frio"

    notes:
      1sg: "[[Irregular]]: The ~e~ becomes ~i~ (`sinto`). Other persons keep the regular stem."

  preterito_perfeito_indicativo:
    context:
      default:
        cue: "Ontem à noite,"
        hint: "muito calor"

  preterito_imperfeito_indicativo:
    context:
      default:
        cue: "Naquela época,"
        hint: "saudades de casa"

  futuro_indicativo:
    context:
      default:
        cue: "Em breve,"
        hint: "o cheiro do café"

  condicional:
    context:
      default:
        cue: "Sem aquecimento,"
        hint: "arrepios"

  presente_conjuntivo:
    forms:
      1sg: sinta
      2sg: sintas
      3sg: sinta
      1pl: sintamos
      2pl: sintais
      3pl: sintam

    context:
      default:
        cue: "Espero que"
        hint: "menos dor"

    pattern: "[[Irregular]]: The presente do conjuntivo uses the stem `sint-`, from the presente do indicativo eu-form `sinto`."

  preterito_imperfeito_conjuntivo:
    context:
      default:
        cue: "Se"
        hint: "o cheiro do fumo"

  futuro_conjuntivo:
    context:
      default:
        cue: "Quando"
        hint: "o perigo"

  imperativo_afirmativo:
    forms:
      3sg: sinta
      1pl: sintamos
      3pl: sintam

    context:
      default:
        cue: "Por favor,"
        hint: "as flores"

    pattern: "[[Regular]]: Follow normal construction rules."

  imperativo_negativo:
    forms:
      2sg: sintas
      3sg: sinta
      1pl: sintamos
      2pl: sintais
      3pl: sintam

    context:
      default:
        cue: "Por favor, não"
        hint: "medo"

    pattern: "[[Regular]]: Forms follow normal construction rule."

  infinitivo_pessoal:
    context:
      default:
        cue: "É importante"
        hint: "a diferença"

  gerundio:
    context:
      default:
        cue: "Ele encolheu-se,"
        hint: "frio"

  participio_passado:
    context:
      default:
        cue: "Depois de ter"
        hint: "o impacto"
