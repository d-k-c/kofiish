tenses:
  presente_indicativo:
    forms:
      1sg: peço

    context:
      default:
        cue: "Todos os dias,"
        hint: "ajuda"

    notes:
      1sg: "[[Irregular]]: The ~d~ becomes ~ç~ (`peço`). Other persons keep the regular stem."

  preterito_perfeito_indicativo:
    context:
      default:
        cue: "Ontem,"
        hint: "um favor"

  preterito_imperfeito_indicativo:
    context:
      default:
        cue: "Em criança,"
        hint: "desculpa por tudo"

  futuro_indicativo:
    context:
      default:
        cue: "Amanhã,"
        hint: "a conta no restaurante"

  condicional:
    context:
      default:
        cue: "Nesse caso,"
        hint: "outra oportunidade"

  presente_conjuntivo:
    forms:
      1sg: peça
      2sg: peças
      3sg: peça
      1pl: peçamos
      2pl: peçais
      3pl: peçam

    context:
      default:
        cue: "Espero que"
        hint: "desculpa"

    pattern: "[[Irregular]]: The presente do conjuntivo uses the stem `peç-`, from the presente do indicativo eu-form `peço`."

  preterito_imperfeito_conjuntivo:
    context:
      default:
        cue: "Se"
        hint: "ajuda mais cedo"

  futuro_conjuntivo:
    context:
      default:
        cue: "Quando"
        hint: "alguma coisa"

  imperativo_afirmativo:
    forms:
      3sg: peça
      1pl: peçamos
      3pl: peçam

    context:
      default:
        cue: "Por favor,"
        hint: "desculpa"

    pattern: "[[Regular]]: Follow normal construction rules."

  imperativo_negativo:
    forms:
      2sg: peças
      3sg: peça
      1pl: peçamos
      2pl: peçais
      3pl: peçam

    context:
      default:
        cue: "Por favor, não"
        hint: "isso"

    pattern: "[[Regular]]: Forms follow normal construction rule."

  infinitivo_pessoal:
    context:
      default:
        cue: "É importante"
        hint: "com educação"

  gerundio:
    context:
      default:
        cue: "Ela conseguiu o emprego"
        hint: "ajuda a um antigo colega"

  participio_passado:
    context:
      default:
        cue: "Depois de ter"
        hint: "várias vezes"
