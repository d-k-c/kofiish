metadata:
  lemma: ter
  translation: to have

transformations:
  - conjugator_er
  - ter_compound

analogs:
  conter: {}
  deter: {}
  entreter: {}
  reter: {}
  suster: {}

tenses:
  presente_indicativo:
    context:
      default:
        cue: "Agora"
        hint: "dois irmãos"

    notes:
      1sg: "*Highly irregular form*."
      2sg: "*Highly irregular form*."
      3sg: "*Highly irregular form*."
      1pl: "*Highly irregular form*."
      2pl: "*Highly irregular form*. Note the extra ~d~."
      3pl: "*Highly irregular form*. The circumflex tells `têm` (eles) apart from `tem` (ele)."

  preterito_perfeito_indicativo:
    context:
      default:
        cue: "No ano passado,"
        hint: "muito trabalho"

    pattern: "[[Irregular]]: The pretérito perfeito uses the stem `tiv-` (except `teve`)."
    notes:
      1sg: "*Highly irregular form*."
      3sg: "*Highly irregular form*."

  preterito_imperfeito_indicativo:
    pattern: |
      *Highly irregular form*.
      [[Irregular]]: The pretérito imperfeito uses the stem `tinh-` or `tính-`.

    context:
      default:
        cue: "Em criança,"
        hint: "um cão"

  futuro_indicativo:
    context:
      default:
        cue: "No próximo ano,"
        hint: "mais tempo livre"

  condicional:
    context:
      default:
        cue: "Se fosse o caso,"
        hint: "uma casa maior"

  presente_conjuntivo:
    context:
      default:
        cue: "Espero que"
        hint: "tempo suficiente"

    pattern: "[[Irregular]]: The presente do conjuntivo uses the stem `tenh-`, from the presente do indicativo eu-form `tenho`."

  preterito_imperfeito_conjuntivo:
    context:
      default:
        cue: "Se"
        hint: "mais dinheiro"

    pattern: "[[Irregular]]: The pretérito imperfeito do conjuntivo uses the stem `tiv-`."
    notes:
      1pl: "`-êssemos` is the regular ending for verbs in ~-er~. Note the change ~ê → é~."
      2pl: "`-êsseis` is the regular ending for verbs in ~-er~. Note the change ~ê → é~."

  futuro_conjuntivo:
    context:
      default:
        cue: "Quando"
        hint: "a oportunidade"

    pattern: "[[Irregular]]: The futuro do conjuntivo uses the stem `tiv-`."

  imperativo_afirmativo:
    context:
      default:
        cue: "Neste momento,"
        hint: "paciência"

    notes:
      2sg: "[[Irregular]]: This form is usually built on ~tu~ form of the presente do indicativo without the final ~s~, which would give *ten*."
      3sg: "[[Regular]]: Same presente do conjuntivo ~ele~ form."
      1pl: "[[Regular]]: Same presente do conjuntivo ~nós~ form."
      2pl: "[[Regular]]: Built on ~vós~ form of the presente do indicativo without the final ~s~."
      3pl: "[[Regular]]: Same presente do conjuntivo ~eles~ form."

  imperativo_negativo:
    context:
      default:
        cue: "Por favor, não"
        hint: "medo"

    pattern: "[[Regular]]: Forms follow normal construction rule."

  infinitivo_pessoal:
    context:
      default:
        cue: "É bom"
        hint: "amigos por perto"

  gerundio:
    context:
      default:
        cue: "Ele conseguiu o lugar,"
        hint: "apenas vinte anos"

  participio_passado:
    context:
      default:
        cue: "Depois de ter"
        hint: "a oportunidade"
