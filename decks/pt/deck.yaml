metadata:
  language: portuguese
  model:
    id: 1655903400
    name: "KOFI Portuguese"
  deck:
    id: 1662045664
    name: 'KOFIISH::KOFI Portuguese (Portugal)'
  # options preset the deck is imported with (tick "Import deck presets" in
  # Anki's import dialog); FSRS itself is a collection setting, enabled by hand
  options:
    id: 1758808800
    name: "KOFIISH Portuguese"
    new_per_day: 0
    reviews_per_day: 9999
    learning_steps: [15]
    new_card_order: sequential
    relearning_steps: [15]
    leech_threshold: 9999
    maximum_interval: 1826
    desired_retention: 0.90

# UUID and Prompt are always included
fields:
  - Similar
  - Notes
  - Dictionaries
  - Pronunciation
  - Sentence_Translation

verbs:
  # Base Corpus
  - ter
  - ser
  - estar
  - haver
  # -ar termination with regular stem changes
  - falar
  - ficar
  - começar
  - chegar
  # -er termination with regular stem changes
  - vender
  - parecer
  - proteger
  # -ir termination with regular stem changes
  - partir
  - exigir
  - distinguir
  # Most common irregular verbs
  - fazer
  - ir
  - dizer
  - poder
  - ver
  - dar
  - saber
  - querer
  - dever
  - vir
  - trazer
  - pôr
  - dormir
  - sair
  - chamar
  - chamar-se
  - ler
  - pedir
  - ouvir
  - sentir
  - subir
  - pagar
  - chover
  - construir
  - rir

pronouns:
  1sg:
    prompt: "eu"
  2sg:
    prompt: "tu"
  3sg:
    prompt: "ele | ela"
    tag: "ele_ela"
  1pl:
    prompt: "nós"
  2pl:
    prompt: "vós"
  3pl:
    prompt: "eles | elas"
    tag: "eles_elas"
  all:
    prompt: null
    tag: null

tenses:
  presente_indicativo:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "⊙"

  preterito_perfeito_indicativo:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "↧"

  preterito_imperfeito_indicativo:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "←"

  futuro_indicativo:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "→"

  condicional:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "…"

  presente_conjuntivo:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "〰"

  preterito_imperfeito_conjuntivo:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "↫"

  futuro_conjuntivo:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "↬"

  imperativo_afirmativo:
    forms:
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "!"
    pronoun_hint: true
    pronouns:
      3sg: "você"
      3pl: "vocês"

  imperativo_negativo:
    forms:
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "!"
    pronoun_hint: true
    pronouns:
      3sg: "você"
      3pl: "vocês"


  infinitivo_pessoal:
    forms:
      - 1sg
      - 2sg
      - 3sg
      - 1pl
      - 2pl
      - 3pl
    cue: "↻"

  gerundio:
    forms:
      - all
    cue: "▷"

  participio_passado:
    forms:
      - all
    cue: "✓"
